{% extends 'base.html' %}{% block title %}Create Customer Account | Pickford Movers{% endblock %}{% block content %}<section class="page-hero"><div class="container"><p class="eyebrow">CUSTOMER PORTAL</p><h1>Create your account</h1><p>Use the same email and phone number you used when requesting a quote to link existing requests.</p></div></section><section class="section"><div class="container" style="max-width:620px"><div class="content-card"><form method="post"><label>Full name</label><input name="full_name" required autocomplete="name"><label>Email address</label><input type="email" name="email" required autocomplete="email"><label>Phone number</label><input name="phone" required autocomplete="tel"><label>Password (at least 10 characters)</label><input type="password" name="password" minlength="10" required autocomplete="new-password"><label>Confirm password</label><input type="password" name="confirm_password" minlength="10" required autocomplete="new-password"><button class="btn btn-gold" type="submit">Create account</button></form><p>Already registered? <a href="{{ url_for('customer_login') }}">Sign in</a>.</p></div></div></section>{% endblock %}
