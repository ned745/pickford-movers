<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Pickford Movers</title><link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css') }}"></head><body class="login-page"><form class="login-card" method="post"><a class="login-logo" href="{{ url_for('home') }}">PM</a><span class="eyebrow">PICKFORD MOVERS</span><h1>Admin sign in</h1><p>Access the private management workspace.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="primary full">Sign in securely</button><a class="return-link" href="{{ url_for('home') }}">← Return to public website</a></form></body></html>
