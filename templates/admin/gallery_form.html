{% extends 'admin/base.html' %}{% block title %}Add project | Pickford Admin{% endblock %}{% block heading %}Add a gallery project{% endblock %}{% block content %}<section class="form-panel"><p class="form-intro">Share a completed Pickford Movers project. Visitors will only see it after you publish it.</p><form method="post" enctype="multipart/form-data" class="project-form"><label>Project title <input name="title" required maxlength="120" placeholder="e.g. Residential relocation — Nairobi"></label><label>Project photo <input type="file" name="image" accept=".jpg,.jpeg,.png,.webp,.gif" required><small>JPG, PNG, WEBP or GIF · Maximum 8 MB</small></label><label>Category <select name="category"><option value="">Choose category</option><option>Residential relocation</option><option>Office relocation</option><option>International relocation</option><option>Packing and unpacking</option><option>Storage and warehousing</option><option>Vehicle transportation</option><option>Cargo and freight</option><option>Other</option></select></label><label>Location <input name="location" maxlength="100" placeholder="e.g. Nairobi, Kenya"></label><label>Completion date <input type="date" name="completed_date"></label><label>Project description <textarea name="description" rows="4" maxlength="1000" placeholder="Briefly describe the work completed..."></textarea></label><label class="check-row"><input type="checkbox" name="published"> Publish this project on the public website immediately</label><div class="form-actions"><button class="primary">Save project</button><a class="secondary" href="{{ url_for('admin_gallery') }}">Cancel</a></div></form></section>{% endblock %}
